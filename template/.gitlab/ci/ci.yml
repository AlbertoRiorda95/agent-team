# .gitlab/ci/ci.yml: the project's CI. It checks every MR, whoever wrote it
# (you or an agent): build, test, static analysis, SBOM and licenses,
# vulnerabilities.
# CUSTOMIZE: images and commands of your stack (SETUP.md fills them in).

# The CI jobs never run in the pipelines that start an agent (AI_FLOW_INPUT).
.ci:
  rules:
    - if: $AI_FLOW_INPUT
      when: never
    - when: on_success
  image: node:24-bookworm          # CUSTOMIZE: your toolchain image
  cache:
    key:
      files: [package-lock.json]   # CUSTOMIZE: your lockfile
    paths: [.npm/]
    policy: pull-push

build:
  extends: .ci
  stage: build
  script:                          # CUSTOMIZE: AGENTS.md > Commands
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck            # CUSTOMIZE: tsc --noEmit, mypy, pyright, go vet...
    - npm run build

test:
  extends: .ci
  stage: test
  needs: []
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Static analysis for bugs and unsafe code. In an MR only the findings it
# introduces fail the job; on the default branch the full report is kept.
static-analysis:
  extends: .ci
  stage: scan
  needs: []
  image: python:3.13-slim-bookworm
  cache: []
  variables:
    GIT_DEPTH: "0"                 # the history up to the MR base, for the baseline
    BASELINE_REF: $CI_MERGE_REQUEST_DIFF_BASE_SHA
  before_script:
    - apt-get update -qq && apt-get install -y -qq git jq >/dev/null
  script:
    - ./ci/install-scanners.sh semgrep
    - ./ci/scan.sh static
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/semgrep.*]

sbom-licenses:
  extends: .ci
  stage: scan
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq curl >/dev/null
  script:
    # dependencies installed without running their scripts: license data come from them
    - npm ci --cache .npm --prefer-offline --ignore-scripts   # CUSTOMIZE
    - ./ci/install-scanners.sh
    - ./ci/scan.sh sbom-licenses
  artifacts:
    when: always
    expire_in: 90 days
    paths: [reports/]

vulnerabilities:
  extends: .ci
  stage: scan
  needs: [sbom-licenses]
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq curl >/dev/null
  script:
    - ./ci/install-scanners.sh
    - ./ci/scan.sh vulnerabilities
    # CUSTOMIZE: to scan the container image too, build it in an earlier job,
    # push it to the project registry and set IMAGE to its reference.
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/grype.*
      - reports/trivy-*.json

# UI tests: run only when playwright.config.ts exists (rename the .example).
ui:
  extends: .ci
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright:v1.63.0-noble   # CUSTOMIZE: same version as @playwright/test
  rules:
    - if: $AI_FLOW_INPUT
      when: never
    - exists: [playwright.config.ts]
  script:
    - npm ci --cache .npm --prefer-offline            # CUSTOMIZE
    - npx playwright test
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/ui/]

# Reference documentation built from the code (OpenAPI, typedoc, pdoc...) by
# ci/reference.sh. Kept as an artifact, not committed: the writer's documents
# link to it. Add a Pages job here if you want it published.
reference-docs:
  extends: .ci
  stage: scan
  needs: []
  script:
    - npm ci --cache .npm --prefer-offline --ignore-scripts   # CUSTOMIZE
    - ./ci/reference.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/reference/]
