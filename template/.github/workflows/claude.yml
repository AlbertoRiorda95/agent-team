# .github/workflows/claude.yml
# @claude <request> on an issue or a pull request that no agent owns (yours,
# Dependabot's...). A task's issue and its pull request belong to the agent that
# started it: there @claude only answers to write "/agent <request>" instead
# (agents.yml, ci/agent-owner.sh).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  owner:
    # Comments on an issue with the agent:split label belong to split.yml.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'agent:split')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      role: ${{ steps.owner.outputs.role }}
    steps:
      # the script of the default branch, never the pull request's
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
          RUNNERS: ${{ vars.AGENT_RUNNERS }}
          DEFAULT_RUNNER: ${{ vars.AGENT_DEFAULT_RUNNER || '__AGENT_TEAM_LEAD__' }}
        run: ./ci/agent-owner.sh github | tee -a "$GITHUB_OUTPUT"
      - if: steps.owner.outputs.role != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ROLE: ${{ steps.owner.outputs.role }}
          RUNNER: ${{ steps.owner.outputs.runner }}
        run: |
          gh issue comment "$NUMBER" --body "This task belongs to the $ROLE agent ($RUNNER): only it works on the issue and its pull request, with its folders, skills and model. Start your comment with \`/agent <request>\` to ask it."

  claude:
    needs: owner
    if: needs.owner.outputs.role == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967  # v1.0.252
        id: claude
        env:
          # In CI everything runs in the foreground: background subagents or commands are lost when the run ends.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # Compact at 200K tokens instead of near the 1M window: every turn re-reads the context.
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "200000"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CUSTOMIZE: the build and test commands of your stack (npm here)
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Bash(npm:*),Bash(npx:*)"
      # Tokens and cost of this run: in the job summary, and as the usage artifact (scripts/usage.py).
      - name: Usage
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.execution_file }}
          TITLE: "@claude #${{ github.event.issue.number || github.event.pull_request.number }}"
        run: python3 scripts/usage.py claude-result "$RESULT" --title "$TITLE" --json "$RUNNER_TEMP/usage.jsonl"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: usage-${{ github.job }}
          path: ${{ runner.temp }}/usage.jsonl
          if-no-files-found: ignore
          retention-days: 90
